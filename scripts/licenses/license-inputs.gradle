// Gradle init script used by scripts/generate_notices.dart: writes, for one
// resolvable configuration, every external module it resolves with the POM
// (and parent POMs) and artifact files Gradle resolved for it, so licence
// texts come from Gradle's own resolution rather than its cache layout.
//
//   gradlew -I scripts/licenses/license-inputs.gradle \
//     -PlicenseConfiguration=releaseRuntimeClasspath -PlicenseOutput=<file.json> \
//     <project>:exportLicenseInputs
//
// Output: {"modules": {"g:a:v": {"pom": path|null, "files": [path...]}},
//          "poms": {"g:a:v": path}}  (poms also holds parent POMs)

import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

allprojects {
    tasks.register('exportLicenseInputs') {
        notCompatibleWithConfigurationCache('reads configurations at execution time')
        doLast {
            def confName = project.property('licenseConfiguration') as String
            def output = project.file(project.property('licenseOutput') as String)
            def conf = project.configurations.getByName(confName)

            def modules = new TreeMap<String, Map>()
            conf.incoming.resolutionResult.allComponents.each { c ->
                if (c.id instanceof ModuleComponentIdentifier) {
                    modules["${c.id.group}:${c.id.module}:${c.id.version}".toString()] = [pom: null, files: []]
                }
            }
            conf.incoming.artifactView { lenient = true }.artifacts.each { a ->
                def id = a.id.componentIdentifier
                if (id instanceof ModuleComponentIdentifier) {
                    def key = "${id.group}:${id.module}:${id.version}".toString()
                    modules.computeIfAbsent(key) { [pom: null, files: []] }.files << a.file.absolutePath
                }
            }

            // POMs, then their parents, as artifact-only (@pom) dependencies.
            def poms = new TreeMap<String, String>()
            def pending = modules.keySet() as List
            while (!pending.isEmpty()) {
                def detached = project.configurations.detachedConfiguration(
                    pending.collect { project.dependencies.create("${it}@pom") } as Dependency[])
                detached.transitive = false
                def next = []
                detached.resolvedConfiguration.lenientConfiguration.artifacts.each { art ->
                    def v = art.moduleVersion.id
                    def key = "${v.group}:${v.name}:${v.version}".toString()
                    poms[key] = art.file.absolutePath
                    def parent = (art.file.getText('UTF-8') =~ /(?s)<parent>(.*?)<\/parent>/)
                    if (parent.find()) {
                        def tag = { String name -> ((parent.group(1) =~ /<${name}>\s*([^<]*?)\s*<\/${name}>/)[0][1]) }
                        def pk = "${tag('groupId')}:${tag('artifactId')}:${tag('version')}".toString()
                        if (!poms.containsKey(pk) && !next.contains(pk)) next << pk
                    }
                }
                pending = next.findAll { !poms.containsKey(it) }
            }
            modules.each { k, v -> v.pom = poms[k] }

            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([modules: modules, poms: poms]))
            println "license inputs: ${modules.size()} modules, ${poms.size()} POMs -> ${output}"
        }
    }
}
