# Host dependency graph of the desktop Tachi worker (U3, KTD1).
#
# The extension-facing libraries (Kotlin, coroutines, serialization, OkHttp,
# jsoup, Injekt) track the "app-provided" bundle that keiyoushi extensions are
# compiled against (keiyoushi/extensions-source gradle/libs.versions.toml at
# ef952a64, extensionLib 1.6). A host older than the extensions' compile
# classpath fails at link time, so raise these together with the extension lib.
# Licences are recorded in THIRD_PARTY.md; versions are locked in gradle.lockfile.

[versions]
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
zstd-kmp = "0.4.0"
jsoup = "1.22.2"
# mihonapp/injekt at 91edab2317 (JitPack), the DI library extensions-lib 1.6 links against.
injekt = "91edab2317"
rxjava = "1.3.8"
# Same AGP line keiyoushi signs with; apksig verifies APK v1-v4 signatures.
apksig = "9.5.1"
# ThexXTURBOXx/dex2jar (maintained fork), Apache-2.0.
dex2jar = "2.4.39"
junit = "5.13.4"
bouncycastle = "1.82"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
zstd-kmp-okio = { module = "com.squareup.zstd:zstd-kmp-okio", version.ref = "zstd-kmp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
injekt = { module = "com.github.mihonapp:injekt", version.ref = "injekt" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
dex2jar = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
