      #     mv app-arm64-v8a-release.apk ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-arm64-v8a.apk
      #     mv app-armeabi-v7a-release.apk ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-armeabi-v7a.apk
      #     mv app-x86_64-release.apk ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-x86_64.apk

      # - name: Upload Split APKs
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-split
      #     path: build/app/outputs/flutter-apk/${{ github.event.repository.name }}-*.apk

      # - name: Release Split APKs
      #   if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
      #   uses: ncipollo/release-action@v1
      #   with:
      #     artifacts: build/app/outputs/flutter-apk/${{ github.event.repository.name }}-*.apk
      #     allowUpdates: true
      #     omitBodyDuringUpdate: true

      - name: Build Universal APK
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            flutter pub get
            flutter build apk --release
            cd build/app/outputs/flutter-apk
            mv app-release.apk ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-universal.apk

      # tool/jnigen.dart reads the Kotlin facade classes the APK build compiled.
      - name: Verify source_runtime_android JNI bindings are current
        run: |
          (cd packages/source_runtime_android && dart run tool/jnigen.dart)
          drift="$(git status --porcelain -- packages/source_runtime_android/lib/src/bindings)"
          if [ -n "$drift" ]; then
            echo "::error::source_runtime_android bindings are stale; build the app, run 'melos run jnigen:android' and commit the result."
            echo "$drift"
            git diff --stat -- packages/source_runtime_android/lib/src/bindings
            exit 1
          fi

      # U14: resolved SDK levels, signing identity, native library hashes
      # (equal to AGP's stripped outputs), shipped notices, and no extension,
      # capture or repository configuration in the release APK.
      - name: Verify the Android third-party notices are current
        run: dart run scripts/generate_notices.dart android --check

      - name: Check the release APK package
        run: |
          python3 -I scripts/android_package_check.py \
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-universal.apk \
            build/android-package-check.json --build-dir build

