        id: smoke_runtime
        if: steps.package_runtime.outcome == 'success'
        continue-on-error: ${{ !(github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')) }}
        run: xvfb-run -a dart run scripts/smoke_packaged_cli.dart --receipt build/package-smoke-linux-x64.json

      - name: Upload smoke receipt
