          max_attempts: 3
          retry_on: error
          command: dart run scripts/package_cli.dart
        env:
          TACHI_JAVA_HOME: ${{ env.JAVA_HOME }}

      # Copies the package into a path with spaces, runs it with no system
      # Java/Dart/Gradle/Rust on PATH, checks manifest hashes and licences,
      # starts every bundled runtime offline and checks nothing outlives a
      # close or a killed CLI.
      - name: Smoke test packaged CLI
        run: dart run scripts/smoke_packaged_cli.dart --receipt build/package-smoke-windows.json

      - name: Check evidence receipts
