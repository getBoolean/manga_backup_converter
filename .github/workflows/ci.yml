name: CI
on:
  workflow_dispatch:
    inputs:
      flavor:
        type: choice
        description: "Flavor"
        default: "dev"
        required: false
        options:
          - "dev"
          - "staging"
          - "prod"
      run_tests:
        description: "Run tests"
        default: true
        required: false
        type: boolean
  push:
    branches:
      - "**"
      - "!gh-pages"
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: "stable"
  FLUTTER_VERSION: "3.50.0"
  FLAVOR: ""
  # https://github.com/transferwise/sanitize-branch-name/blob/main/action.yml
  BRANCH_NAME: $(echo -n ${{ github.head_ref || github.ref_name }} | tr "/" "-")
  MELOS_VERSION: $(grep -E '^\s+melos:' pubspec.yaml | awk '{print $2}')

# Needed to deploy to GitHub Pages
permissions:
  contents: write

jobs:
  analyze:
    name: Analyze
    if: github.event.inputs.run_tests != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: Check Flutter Version
        run: flutter --version

      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Verify Formatting
        run: melos run verify_format

      - name: Annotate PR
        uses: invertase/github-action-dart-analyzer@1cda5922c6369263b1c7e2fbe281f69704f4d63e # v2.0.0
        with:
          fatal-infos: false
          fatal-warnings: false
          annotate-only: true

      - name: Run Dart Analyzer
        run: melos run analyze

      - name: Verify Android Aidoku fixture bundle is current
        run: dart run tool/generate_android_aidoku_fixtures.dart --check

      # jnigen downloads the pinned Jsoup sources from Maven and needs a JDK.
      - name: Setup Java JDK
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93 # v4.0.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Verify jsoup JNI bindings are current
        run: |
          (cd packages/jsoup_jni && dart run tool/generate_jni_bindings.dart)
          drift="$(git status --porcelain -- packages/jsoup_jni/lib/src/bindings)"
          if [ -n "$drift" ]; then
            echo "::error::jsoup_jni bindings are stale; run 'melos run jnigen' and commit the result."
            echo "$drift"
            git diff --stat -- packages/jsoup_jni/lib/src/bindings
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    needs: [analyze]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: macos-14
            architecture: arm64
    steps:
      - name: Enable Git Long Paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set Variables
        run: |
          flavor="${{ github.event.inputs.flavor }}"
          if [ -z "$flavor" ]; then
            flavor="dev"
          fi
          echo "FLAVOR=$flavor" >> $GITHUB_ENV
        shell: bash

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: ${{ matrix.architecture }}

      - name: Check Flutter Version
        run: flutter --version

      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Install Rust toolchain
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Run Tests
        if: runner.os == 'Linux'
        run: melos run test

      - name: Run Tests (no coverage)
        if: runner.os != 'Linux'
        run: melos run flutter_test && melos run dart_test_no_coverage

      - name: Setup Java JDK (Tachi worker)
        if: runner.os == 'Linux'
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93 # v4.0.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Run Tachi worker tests
        if: runner.os == 'Linux'
        working-directory: tools/tachi-source-runner
        run: ./gradlew test --no-daemon

      - name: Upload Coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && !startsWith(github.event.ref, 'refs/tags/v')
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: "**/*/lcov.info"

  benchmarks:
    name: KTD25 benchmarks (${{ matrix.os }}, non-gating)
    needs: [analyze]
    runs-on: ${{ matrix.os }}
    # A report, never a gate: timings depend on the runner. Compare the
    # uploaded results with the committed ones (docs/CI.md).
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: macos-14
            architecture: arm64
    steps:
      - name: Enable Git Long Paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: ${{ matrix.architecture }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Install Rust toolchain
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Setup Java JDK (Tachi worker)
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93 # v4.0.0
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Create report directory
        shell: bash
        run: mkdir -p build/benchmarks

      - name: Paperback bundle benchmark (JIT)
        run: flutter test packages/paperback_plugin_loader/benchmark/paperback_bundles_benchmark_test.dart
        env:
          QJS_BENCH_OUT: ${{ github.workspace }}/build/benchmarks/paperback-bundles-jit.json

      - name: Paperback bundle benchmark (AOT, as the worker ships)
        working-directory: packages/paperback_plugin_loader
        shell: bash
        run: |
          dart build cli -t benchmark/bundle_benchmark_main.dart -o ../../build/bench-aot
          exe=../../build/bench-aot/bundle/bin/bundle_benchmark_main
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" ../../fixtures/source_captures/paperback ../../build/benchmarks/paperback-bundles-aot.json

      - name: Tachi worker benchmark (quick)
        working-directory: tools/tachi-source-runner
        shell: bash
        run: ./gradlew --no-daemon --quiet benchmark -PbenchmarkArgs="--quick" > ../../build/benchmarks/tachi-worker-quick.json

      - name: Committed results match the current workers and sizing rules
        shell: bash
        run: dart run tool/check_benchmark_results.dart | tee build/benchmarks/committed-results-check.txt

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ktd25-benchmarks-${{ matrix.os }}
          path: build/benchmarks/
          if-no-files-found: ignore

  test_web:
    name: Test (Web)
    needs: [analyze]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set Variables
        run: |
          flavor="${{ github.event.inputs.flavor }}"
          if [ -z "$flavor" ]; then
            flavor="dev"
          fi
          echo "FLAVOR=$flavor" >> $GITHUB_ENV

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: Check Flutter Version
        run: flutter --version

      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Run Web Tests
        run: melos run web_test

  build_ios:
    name: Build Flutter for iOS (Without Signing)
    needs: [test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set Variables
        run: |
          echo "Inputs: ${{ toJSON(github.event.inputs) }}"

          is_tag_string=${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') }}
          is_tag=false
          if [ "$is_tag_string" = "true" ]; then
            is_tag=true
          fi

          flavor=""
          if $is_tag; then
            flavor="prod"
          elif [ -z "${{ github.event.inputs.flavor }}" ]; then
            flavor="dev"
          else
            flavor="${{ github.event.inputs.flavor }}"
          fi
          echo "FLAVOR=$flavor" >> $GITHUB_ENV
          echo "FLAVOR=$flavor"

          echo "BRANCH_NAME=${{ env.BRANCH_NAME }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ env.BRANCH_NAME }}"

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: Check Flutter Version
        run: flutter --version

      # Make environment variables available to the melos generate script.
      #
      # The environment variables need to be defined in the repository secrets
      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Read QuickJS-ng submodule commit
        id: quickjs_rev
        run: echo "rev=$(git rev-parse HEAD:packages/quickjs/vendor/quickjs)" >> "$GITHUB_OUTPUT"
        shell: bash

      # QuickJS is compiled from the vendored QuickJS-ng source by the package build hook.
      - name: Cache QuickJS build hook output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/quickjs
          key: quickjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.quickjs_rev.outputs.rev }}-${{ hashFiles('packages/quickjs/**', '!packages/quickjs/vendor/**') }}

      - name: Cache build hook artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dart_tool/hooks_runner/shared/wasm3
            .dart_tool/hooks_runner/shared/scraper-*
            .dart_tool/hooks_runner/shared/swiftsoup-*
          key: build-hooks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/wasm3/hook/build.dart', 'packages/scraper/hook/build.dart', 'packages/scraper/rust/Cargo.lock', 'packages/swiftsoup/hook/build.dart', 'packages/swiftsoup/swift/Sources/**') }}

      - name: Bootstrap Melos
        run: melos bootstrap

      # Zip into IPA from here:
      # https://gist.github.com/devhammed/617d920b7ee886591a46c22633ab0093
      - name: Build Flutter IPA
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          # SOURCE_RELEASE_TAG makes the licence page link this release's
          # GPL source archive (attached below); other builds say they are
          # untagged.
          command: |
            tag_define=""
            if [ "${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') }}" = "true" ]; then
              tag_define="--dart-define=SOURCE_RELEASE_TAG=${{ github.ref_name }}"
            fi
            flutter build ios --release --no-codesign --dart-define=SOURCE_COMMIT=${{ github.sha }} $tag_define
            cd build/ios/iphoneos
            mkdir Payload
            cd Payload
            ln -s ../Runner.app
            cd ..
            zip -r app-release.ipa Payload
            mv app-release.ipa ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-ios.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-ios
          path: build/ios/iphoneos/${{ github.event.repository.name }}-*.ipa
      # GPLv2 section 3(a): the corresponding source of the statically linked
      # OpenJDK runtime accompanies the iOS build, as an asset of the same
      # release (built from the pins in tools/tachi-source-runner/ios/
      # manifest.env at this commit, checked against the runtime receipt).
      - name: Build the iOS runtime's corresponding-source archive
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        run: dart run scripts/build_gpl_source_archive.dart --ref ${{ github.sha }} --tag ${{ github.ref_name }} --out build/gpl-source

      - name: Release IPA and its runtime source
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: |
            build/ios/iphoneos/${{ github.event.repository.name }}-*.ipa
            build/gpl-source/*-ios-runtime-source.tar.gz
            build/gpl-source/*-ios-runtime-source.tar.gz.sha256
          allowUpdates: true
          omitBodyDuringUpdate: true

