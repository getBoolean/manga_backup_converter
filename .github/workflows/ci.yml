        if: steps.package_runtime.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-linux
          path: build/package/linux-x64/

      - name: Create Release Archive
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        run: |
          test -f build/package/linux-x64/runtime/runtime-manifest.json
          cd build/package
          tar -czf ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-linux.tar.gz -C linux-x64 .

      - name: Release CLI
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/package/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-linux.tar.gz
          allowUpdates: true
          omitBodyDuringUpdate: true

