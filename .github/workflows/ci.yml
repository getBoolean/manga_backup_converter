        with:
          name: android-package-check
          path: build/android-package-check.json
          if-no-files-found: ignore

      - name: Upload Universal APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-universal
          path: build/app/outputs/flutter-apk/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-universal.apk

      - name: Release Universal APKs
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/app/outputs/flutter-apk/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-universal.apk
          allowUpdates: true
          omitBodyDuringUpdate: true

      - name: Build Android App Bundle
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: |
            flutter pub get
            flutter build appbundle --release
            cd build/app/outputs/bundle/release
            mv app-release.aab ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-appbundle.aab

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-android-appbundle
          path: build/app/outputs/bundle/release/*.aab

      - name: Release Android App Bundle
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/app/outputs/bundle/release/${{ github.event.repository.name }}-*.aab
          allowUpdates: true
          omitBodyDuringUpdate: true

  build_windows:
    name: Build Flutter for Windows x64
    needs: [test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      # Need to enable long paths for Windows because the forked version of go_router
      # causes a long path error when building for Windows in CI
      - name: Enable Git Long Paths
        run: git config --system core.longpaths true
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set Variables
        run: |
          $is_tag = "${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') }}"
          $flavor = ""
          if ($is_tag) {
              $flavor = "prod"
          }
          elseif ([string]::IsNullOrEmpty("${{ github.event.inputs.flavor }}")) {
              $flavor = "dev"
          }
          else {
              $flavor = "${{ github.event.inputs.flavor }}"
          }

          "FLAVOR=$flavor" | Out-File -Append -LiteralPath $Env:GITHUB_ENV
          Write-Output "FLAVOR=$flavor"


          "BRANCH_NAME=${{ env.BRANCH_NAME }}" | Out-File -Append -LiteralPath $Env:GITHUB_ENV
          Write-Output "BRANCH_NAME=${{ env.BRANCH_NAME }}"
        shell: pwsh

      - name: Print Variables
        run: |
          Write-Output "Current Flavor: ${{ env.FLAVOR }}"

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: Check Flutter Version
        run: flutter --version

      # Make environment variables available to the melos generate script.
      #
      # The environment variables need to be defined in the repository secrets
      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Read QuickJS-ng submodule commit
        id: quickjs_rev
        run: echo "rev=$(git rev-parse HEAD:packages/quickjs/vendor/quickjs)" >> "$GITHUB_OUTPUT"
        shell: bash

      # QuickJS is compiled from the vendored QuickJS-ng source by the package build hook.
      - name: Cache QuickJS build hook output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/quickjs
          key: quickjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.quickjs_rev.outputs.rev }}-${{ hashFiles('packages/quickjs/**', '!packages/quickjs/vendor/**') }}

      - name: Cache build hook artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dart_tool/hooks_runner/shared/wasm3
            .dart_tool/hooks_runner/shared/scraper-*
            .dart_tool/hooks_runner/shared/swiftsoup-*
          key: build-hooks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/wasm3/hook/build.dart', 'packages/scraper/hook/build.dart', 'packages/scraper/rust/Cargo.lock', 'packages/swiftsoup/hook/build.dart', 'packages/swiftsoup/swift/Sources/**') }}

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Build Windows
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: flutter build windows --release

      - name: Build MSIX
        run: |
          dart run msix:create --build-windows false
          cd build\windows\x64\runner\Release
          mv mangabackupconverter.msix ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-windows.msix
      - name: Upload MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-windows
          path: build/windows/x64/runner/Release/*.msix

      - name: Release MSIX
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/windows/x64/runner/Release/${{ github.event.repository.name }}-*.msix
          allowUpdates: true
          omitBodyDuringUpdate: true

  build_linux:
    name: Build Flutter for Linux
    needs: [test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Set Variables
        run: |
          echo "Inputs: ${{ toJSON(github.event.inputs) }}"

          is_tag_string=${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') }}
          is_tag=false
          if [ "$is_tag_string" = "true" ]; then
            is_tag=true
          fi

          flavor=""
          if $is_tag; then
            flavor="prod"
          elif [ -z "${{ github.event.inputs.flavor }}" ]; then
            flavor="dev"
          else
            flavor="${{ github.event.inputs.flavor }}"
          fi
          echo "FLAVOR=$flavor" >> $GITHUB_ENV
          echo "FLAVOR=$flavor"

          echo "BRANCH_NAME=${{ env.BRANCH_NAME }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ env.BRANCH_NAME }}"

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{env.FLUTTER_CHANNEL}}
          flutter-version: ${{env.FLUTTER_VERSION}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64
      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install webkit2gtk-4.1 clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev
          sudo apt install -y libfuse2
          sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Check Flutter Version
        run: flutter --version

      # Make environment variables available to the melos generate script.
      #
      # The environment variables need to be defined in the repository secrets
      - name: Load Environment Variables
        uses: oNaiPs/secrets-to-env-action@75f319b3c8c926ac2eabcca34daa6cf531daf32f # v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Activate Melos
        run: dart pub global activate melos ${{ env.MELOS_VERSION }}

      - name: Read QuickJS-ng submodule commit
        id: quickjs_rev
        run: echo "rev=$(git rev-parse HEAD:packages/quickjs/vendor/quickjs)" >> "$GITHUB_OUTPUT"
        shell: bash

      # QuickJS is compiled from the vendored QuickJS-ng source by the package build hook.
      - name: Cache QuickJS build hook output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dart_tool/hooks_runner/shared/quickjs
          key: quickjs-${{ runner.os }}-${{ runner.arch }}-${{ steps.quickjs_rev.outputs.rev }}-${{ hashFiles('packages/quickjs/**', '!packages/quickjs/vendor/**') }}

      - name: Cache build hook artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dart_tool/hooks_runner/shared/wasm3
            .dart_tool/hooks_runner/shared/scraper-*
            .dart_tool/hooks_runner/shared/swiftsoup-*
          key: build-hooks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/wasm3/hook/build.dart', 'packages/scraper/hook/build.dart', 'packages/scraper/rust/Cargo.lock', 'packages/swiftsoup/hook/build.dart', 'packages/swiftsoup/swift/Sources/**') }}

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Build Linux
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: flutter build linux --release

      - name: Build AppImage
        run: |
          curl -JOL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod a+x appimagetool-x86_64.AppImage
          mv appimagetool-x86_64.AppImage appimagetool

          mv build/linux/x64/release/bundle/{${{ github.event.repository.name }},AppRun}
          cp linux/appimage/* build/linux/x64/release/bundle/
          ./appimagetool build/linux/x64/release/bundle/
          mv *.AppImage build/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-linux.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-linux-appimage
          path: build/${{ github.event.repository.name }}-*.AppImage

      - name: Release AppImage
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/${{ github.event.repository.name }}-*.AppImage
          allowUpdates: true
          omitBodyDuringUpdate: true

