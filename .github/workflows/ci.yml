      - name: Upload Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-windows-setup
          path: installer-output/${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-windows-setup.exe

      - name: Create Release Archive
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        run: |
          cd build/package
          Compress-Archive -Path windows-x64/* -DestinationPath ${{ github.event.repository.name }}-${{ env.BRANCH_NAME }}-cli-windows.zip
