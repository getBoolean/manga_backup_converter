        with:
          path: packages/mangabackupconverter_cli/installer/windows_setup.iss
          options: /DBundleDir=${{ github.workspace }}\build\package\windows-x64 /DAppVersion=${{ env.BRANCH_NAME }} /O${{ github.workspace }}\installer-output

