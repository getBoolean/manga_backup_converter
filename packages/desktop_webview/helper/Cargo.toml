[package]
name = "desktop_webview_helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Standalone platform WebView helper behind the desktop BrowserPort (KTD20)"

[[bin]]
name = "desktop_webview_helper"
path = "src/main.rs"

[dependencies]
wry = "=0.57.3"
tao = "=0.37.3"
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSError", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", features = ["block2", "WKContentRuleList", "WKContentRuleListStore", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandler", "WKSecurityOrigin", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
javascriptcore-rs = { version = "=1.1.2", features = ["v2_38"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
