name: desktop_webview
description: >-
  Desktop BrowserPort (KTD20): a Dart client for the standalone
  desktop_webview_helper (wry/tao over WebView2, WKWebView, WebKitGTK),
  its runtime artifact manifest, and the helper build script.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
resolution: workspace

dependencies:
  crypto: ^3.0.0
  meta: ^1.12.0
  path: ^1.9.0
  source_runtime:
    path: ../source_runtime

dev_dependencies:
  app_lints:
    path: ../app_lints
  archive: ^4.0.0
  checks: ^0.3.0
  source_runtime_testing:
    path: ../source_runtime_testing
  test: ^1.24.0
