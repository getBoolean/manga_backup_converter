name: manga_backup_core
description: >-
  Portable manga backup conversion core: Aidoku, Paperback and Tachi codecs,
  normalized library data, reconciliation, loss accounting, destination
  builders and conversion orchestration. Pure Dart; depends only on the
  public source_runtime contracts (KTD14).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
resolution: workspace

dependencies:
  archive: ^4.0.0
  characters: ^1.3.0
  collection: ^1.19.0
  crypto: ^3.0.0
  dart_mappable: ^4.2.2
  fixnum: ^1.1.1
  meta: ^1.12.0
  propertylistserialization: ^1.4.0
  protobuf: ^3.1.0
  source_runtime:
    path: ../source_runtime

dev_dependencies:
  app_lints:
    path: ../app_lints
  build_runner: ^2.4.11
  build_verify: ^3.1.1
  checks: ^0.3.0
  dart_mappable_builder: ^4.2.3
  path: ^1.9.0
  test: ^1.24.0
