output: lib/src/quickjs_bindings_generated.dart
name: NativeQuickJsBindings

description: >
  Auto-generated bindings for the quickjs_dart wrapper (src/quickjs_dart.h)
  over the vendored QuickJS-ng engine.
  Run: dart run ffigen --config ffigen.yaml
  Do not edit by hand — edit ffigen.yaml or the header and regenerate.

headers:
  entry-points:
    - src/quickjs_dart.h
  include-directives:
    - src/quickjs_dart.h

ffi-native:
  asset-id: 'package:quickjs/src/quickjs_bindings_generated.dart'

preamble: |
  // ignore_for_file: camel_case_types, non_constant_identifier_names
  // ignore_for_file: always_specify_types, lines_longer_than_80_chars
  // ignore_for_file: unreachable_from_main, unused_element, type=lint

functions:
  include:
    - 'qjsd_.*'

structs:
  dependency-only: opaque

enums:
  include:
    - '.*'

macros:
  include:
    - 'QJSD_.*'
