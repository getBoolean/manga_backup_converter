name: source_runtime_android
description: >-
  Android source runtime integration: a private `:source_runtime` service
  process for Tachi APK sources, driven from Dart through JNIgen bindings.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  jni: ^0.15.2

dev_dependencies:
  app_lints:
    path: ../app_lints
  checks: ^0.3.0
  jnigen: ^0.15.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
