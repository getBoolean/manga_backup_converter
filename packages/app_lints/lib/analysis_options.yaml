include: package:solid_lints/analysis_options.yaml

plugins:
  solid_lints: ^2.0.0
  riverpod_lint: ^3.2.0

# solid_lints 2.0 (analysis_server_plugin) enables rules that 0.3.x
# (custom_lint) did not; disable them to keep the pre-upgrade rule set.
solid_lints:
  diagnostics:
    avoid_duplicate_code: false
    avoid_multiple_declarations_per_file: false
    avoid_similar_names: false
    feature_envy: false
    prefer_mirror_test_structure: false
    named_parameters_ordering: false
    use_nearest_context: false
    use_descriptive_names_for_type_parameters: false
    # Before Flutter 3.50 these rules ran only through custom_lint, which CI
    # never ran; as analyzer plugins they now fail `dart analyze --fatal-infos`.
    # Existing code violates them, so they stay off until that debt is paid.
    avoid_final_with_getter: false
    avoid_late_keyword: false
    avoid_non_null_assertion: false
    avoid_returning_widgets: false
    avoid_unnecessary_setstate: false
    avoid_unused_parameters: false
    cyclomatic_complexity: false
    function_lines_of_code: false
    member_ordering: false
    newline_before_return: false
    no_empty_block: false
    no_equal_then_else: false
    no_magic_number: false
    number_of_parameters: false
    prefer_conditional_expressions: false
    prefer_early_return: false
    prefer_first: false
    prefer_match_file_name: false

analyzer:
  language:
    strict-inference: true

  errors:
    # Required for Freezed
    invalid_annotation_target: ignore
    close_sinks: ignore
  exclude:
    # generated files
    - "**/*.g.dart"
    # package:dart_mappable
    - "**/*.mapper.dart"

    # package:modddels
    - "**/*.modddel.dart"

    # probably related to localization
    - "**/*.iconfig.dart"

    # i18n vscode extension
    - "**/i18n.dart"

    # package:intl localization
    - "lib/generated/intl/messages*.dart"

    # package:mason_cli
    - "bricks/**"

    # protobuf files
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbjson.dart"
    - "**/*.pbserver.dart"

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at
  # https://dart-lang.github.io/linter/lints/index.html.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # Preference
    prefer_single_quotes: true
    specify_nonobvious_local_variable_types: true
    specify_nonobvious_property_types: true
    omit_obvious_local_variable_types: true
    avoid_catches_without_on_clauses: true
    avoid_catching_errors: true
    empty_catches: true
    use_rethrow_when_possible: true
    control_flow_in_finally: true
    only_throw_errors: true
    throw_in_finally: true
    unawaited_futures: true
    cast_nullable_to_non_nullable: true
    null_check_on_nullable_type_parameter: true
    prefer_null_aware_method_calls: true
    prefer_if_null_operators: true

    # Can help with readability
    # omit_local_variable_types: false

    directives_ordering: true
    unnecessary_constructor_name: true
    # Avoid annotating with dynamic when not required.
    avoid_annotating_with_dynamic: true
    unnecessary_late: true
    use_late_for_private_fields_and_variables: true
    use_to_and_as_if_applicable: true
    avoid_js_rounded_ints: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    do_not_use_environment: true
    missing_whitespace_between_adjacent_strings: true
    prefer_asserts_with_message: true
    require_trailing_commas: false
    unnecessary_null_aware_operator_on_extension_on_nullable: true
    # while important, it is not a priority for an app
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    unnecessary_library_name: true
    invalid_runtime_check_with_js_interop_types: true
    sort_pub_dependencies: false

    # Standard rules added by solid_lints 2.0; disabled to keep the
    # pre-upgrade rule set.
    always_put_required_named_parameters_first: true
    avoid_returning_this: false
    avoid_types_on_closure_parameters: false
    cascade_invocations: false
    discarded_futures: false
    document_ignores: false
    no_literal_bool_comparisons: false
    no_wildcard_variable_uses: false
    unnecessary_ignore: false
    unnecessary_unawaited: false
    unnecessary_underscores: false
    unreachable_from_main: false
    use_enums: false
    use_truncating_division: false
